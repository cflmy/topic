# topic.cflmy.cn — static topic shelf
# Deploy: copy dist/ to root, enable this site, issue cert.

server {
    listen 80;
    listen [::]:80;
    server_name topic.cflmy.cn;

    # root /var/www/topic/dist;
    root /root/work/topic/dist;

    charset utf-8;
    index index.html;

    # Long cache for hashed-less static assets under covers / css / slug assets
    location ~* \.(?:css|js|mjs|webp|jpg|jpeg|png|gif|svg|woff2|woff|ttf|ico)$ {
        expires 12h;
        add_header Cache-Control "public, max-age=43200";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Optional HTTPS (certbot):
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/topic.cflmy.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/topic.cflmy.cn/privkey.pem;
}
